# Static server for the built SPA (replaces `vite preview`, which is a dev
# convenience server not meant for production). Caddy in front terminates TLS,
# compresses (zstd/gzip), routes /api + /socket.io to the backend, and owns
# the public Cache-Control headers; this only serves /app/dist on 4174.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  tcp_nopush on;

  server {
    listen 4174;
    server_name _;
    root /app/dist;
    index index.html;

    # Hashed build artifacts never change under the same name.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Hash-based routing: every non-file path is the SPA shell.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
